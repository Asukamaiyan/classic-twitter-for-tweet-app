name: Fix Japanese notification name separators

on:
  push:
    paths:
      - '.github/workflows/fix-notification-names.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch Japanese userscripts
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          files = [
            (Path('classic-twitter-ja.user.js'), '6.2.9'),
            (Path('classic-twitter-ja-safari.user.js'), '6.3.2'),
          ]

          old = r'''  function actorJP(s) {
    return clean(s)
      .replace(/\s+and\s+/gi, '、')
      .replace(/\s*,\s*/g, '、')
      .split('、')
      .map(x =>
        clean(x).replace(/さん$/, '')
      )
      .filter(Boolean)
      .map(x => `${x}さん`)
      .join('、');
  }
'''

          new = r'''  function actorJP(s) {
    return clean(s)
      .replace(/\s+and\s+/gi, '、')
      .replace(/\s*,\s*/g, '、')
      .split('、')
      .map(x => clean(x).replace(/さん$/, ''))
      .filter(Boolean)
      .map(x => `${x}さん`)
      .join('と');
  }
'''

          for path, version in files:
            s = path.read_text(encoding='utf-8')
            if old not in s:
              raise RuntimeError(f'actorJP block not found: {path}')
            s = s.replace(old, new, 1)
            s = re.sub(r'(?m)^// @version\s+\S+', f'// @version      {version}', s, count=1)
            path.write_text(s, encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-notification-names.yml
          git add classic-twitter-ja.user.js classic-twitter-ja-safari.user.js
          git commit -m "Fix Japanese notification name separators"
          git push

# trigger