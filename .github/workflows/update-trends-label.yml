name: Update Japanese trends label

on:
  push:
    paths:
      - '.github/workflows/update-trends-label.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update label
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          files = [
              (Path('classic-twitter-ja.user.js'), '6.2.6'),
              (Path('classic-twitter-ja-safari.user.js'), '6.2.9'),
          ]

          for path, version in files:
              s = path.read_text(encoding='utf-8')
              s = re.sub(r'(?m)^// @version\s+\S+', f'// @version      {version}', s, count=1)
              if "['Trends for you', 'おすすめのトレンド']" not in s:
                  anchor = "    ['Trending', 'トレンド'],"
                  if anchor not in s:
                      raise RuntimeError(f'anchor missing: {path}')
                  s = s.replace(anchor, anchor + "\n    ['Trends for you', 'おすすめのトレンド'],", 1)
              path.write_text(s, encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/update-trends-label.yml
          git add classic-twitter-ja.user.js classic-twitter-ja-safari.user.js
          git commit -m "Translate Trends for you label"
          git push
