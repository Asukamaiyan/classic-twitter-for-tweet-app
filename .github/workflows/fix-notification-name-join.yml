name: Fix notification name join

on:
  push:
    paths:
      - '.github/workflows/fix-notification-name-join.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch userscripts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          targets = [
              (Path('classic-twitter-ja.user.js'), '6.2.9'),
              (Path('classic-twitter-ja-safari.user.js'), '6.3.2'),
          ]

          for path, version in targets:
              s = path.read_text(encoding='utf-8')
              start = s.find('  function actorJP(s) {')
              end = s.find('\n  }', start)
              if start < 0 or end < 0:
                  raise RuntimeError(f'actorJP not found: {path}')
              block = s[start:end+4]
              if ".join('、');" not in block:
                  raise RuntimeError(f'actorJP join not found: {path}')
              block = block.replace(".join('、');", ".join('と');", 1)
              s = s[:start] + block + s[end+4:]
              s = re.sub(r'(?m)^// @version\s+\S+', f'// @version      {version}', s, count=1)
              path.write_text(s, encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-notification-name-join.yml
          git add classic-twitter-ja.user.js classic-twitter-ja-safari.user.js
          git commit -m "Fix Japanese notification name joins"
          git push

# trigger