name: Build English userscript

on:
  push:
    paths:
      - '.parts/enb64/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check all parts exist
        id: parts
        shell: bash
        run: |
          missing=0
          for i in 00 01 02 03 04 05 06 07; do
            if [ ! -f ".parts/enb64/part${i}" ]; then
              missing=1
            fi
          done
          echo "missing=$missing" >> "$GITHUB_OUTPUT"

      - name: Build and validate
        if: steps.parts.outputs.missing == '0'
        shell: bash
        run: |
          cat .parts/enb64/part00 .parts/enb64/part01 .parts/enb64/part02 .parts/enb64/part03 .parts/enb64/part04 .parts/enb64/part05 .parts/enb64/part06 .parts/enb64/part07 | base64 -d > classic-twitter-en.user.js
          node --check classic-twitter-en.user.js
          grep -q '@version      6.2.3-en' classic-twitter-en.user.js
          if grep -Eq 'APP_THEME_MODE|matchMedia\(|data-ct-theme|applyTheme|systemDark' classic-twitter-en.user.js; then
            echo 'Unexpected theme-handling code detected.'
            exit 1
          fi

      - name: Commit generated userscript
        if: steps.parts.outputs.missing == '0'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add classic-twitter-en.user.js
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'feat: add English userscript v6.2.3-en'
          git push
