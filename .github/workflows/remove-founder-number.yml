name: Remove Founder Number display

on:
  push:
    paths:
      - '.github/workflows/remove-founder-number.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove Founder Number UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          targets = [
              (Path('classic-twitter-ja.user.js'), '6.3.2'),
              (Path('classic-twitter-ja-safari.user.js'), '6.3.5'),
              (Path('classic-twitter-en.user.js'), '6.2.8-en'),
          ]

          for path, version in targets:
              s = path.read_text(encoding='utf-8')
              s = re.sub(r'(?m)^// @version\s+\S+', f'// @version      {version}', s, count=1)
              s = s.replace('、Founder Number', '')
              s = s.replace(', Founder Number', '')
              s = s.replace('Founder Number, ', '')
              s = s.replace('Founder Number', '')

              # Remove Founder badge CSS block(s)
              s = re.sub(
                  r'\n\s*\.ct-founder,\s*\n\s*\.ct-profile-founder\s*\{.*?\}\s*\n\s*\.ct-profile-founder\s*\{.*?\}\s*',
                  '\n', s, flags=re.S)
              s = re.sub(r'\n\s*\.ct-founder,\s*\n\s*\.ct-profile-founder\s*\{.*?\}\s*', '\n', s, flags=re.S)
              s = re.sub(r'\n\s*\.ct-profile-founder\s*\{.*?\}\s*', '\n', s, flags=re.S)
              s = re.sub(r'\n\s*\.ct-founder\s*\{.*?\}\s*', '\n', s, flags=re.S)

              # Remove inline Founder badge creation from timeline article patch.
              s = re.sub(
                  r'\n\s*let badge\s*=\s*leaf\.parentElement.*?badge\.title\s*=\s*`[^`]*`;\s*',
                  '\n', s, flags=re.S)

              # Remove profile Founder patch function entirely.
              s = re.sub(
                  r'\n\s*async function patchProfileFounder\(\)\s*\{.*?\n\s*\}\n\n\s*function cleanupOldNamedMute',
                  '\n\n  function cleanupOldNamedMute', s, flags=re.S)

              # Remove any remaining Founder patch calls.
              s = re.sub(r'\n\s*patchProfileFounder\(\);', '', s)

              # Defensive cleanup of Founder display class references, but leave profile fetching for display names.
              s = s.replace("el.classList.contains(\n                'ct-profile-founder'\n              ) ||\n", '')
              s = s.replace("el.classList.contains('ct-profile-founder') ||", '')

              path.write_text(s, encoding='utf-8')
          PY

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/remove-founder-number.yml
          git add classic-twitter-ja.user.js classic-twitter-ja-safari.user.js classic-twitter-en.user.js
          git commit -m "Remove Founder Number display from all variants"
          git push
