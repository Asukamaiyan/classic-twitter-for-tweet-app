name: Fix Founder Number compatibility

on:
  push:
    paths:
      - '.github/workflows/fix-founder-number.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch all three userscripts
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          files = [
              (Path('classic-twitter-ja.user.js'), '6.2.7'),
              (Path('classic-twitter-ja-safari.user.js'), '6.3.0'),
              (Path('classic-twitter-en.user.js'), '6.2.5-en'),
          ]

          helper = r'''
  function profilePayload(json) {
    const candidates = [
      json?.user,
      json?.profile,
      json?.data?.user,
      json?.data?.profile,
      json?.data,
      json
    ];

    for (const value of candidates) {
      if (!value || typeof value !== 'object') continue;

      if (
        value.foundingMemberNumber !== undefined ||
        value.founderNumber !== undefined ||
        value.founding_member_number !== undefined ||
        value.username ||
        value.handle ||
        value.displayName ||
        value.name
      ) {
        return value;
      }
    }

    return null;
  }

  function founderNumber(user) {
    if (!user || typeof user !== 'object') return null;

    const number =
      user.foundingMemberNumber ??
      user.founderNumber ??
      user.founding_member_number ??
      user.foundingMember?.number ??
      user.founder?.number ??
      user.badges?.foundingMemberNumber ??
      user.badges?.founderNumber ??
      null;

    return number === '' ? null : number;
  }
'''.strip('\n')

          for path, version in files:
              s = path.read_text(encoding='utf-8')
              s = re.sub(r'(?m)^// @version\s+\S+', f'// @version      {version}', s, count=1)

              if 'function profilePayload(json)' not in s:
                  m = re.search(r'(\n\s*function saveJSON\([\s\S]*?\n\s*\}\n)', s)
                  if not m:
                      raise RuntimeError(f'saveJSON block not found: {path}')
                  pos = m.end()
                  s = s[:pos] + '\n' + helper + '\n' + s[pos:]

              s = re.sub(
                  r'const user\s*=\s*json\?\.user\s*\?\?\s*json\?\.profile\s*\?\?\s*json\?\.data\s*\?\?\s*json;',
                  'const user = profilePayload(json);',
                  s
              )

              s = re.sub(
                  r'const user\s*=\s*\n?\s*json\?\.user\s*\n?\s*\?\?\s*\n?\s*json\?\.profile\s*\n?\s*\?\?\s*\n?\s*json\?\.data\s*\n?\s*\?\?\s*\n?\s*json;',
                  'const user =\n              profilePayload(json);',
                  s
              )

              s = s.replace('const number =\n      user.foundingMemberNumber;', 'const number =\n      founderNumber(user);')
              s = s.replace('const number = user.foundingMemberNumber;', 'const number = founderNumber(user);')

              # Also recover if profile is nested one extra layer deeper.
              s = s.replace(
                  'if (user) {\n              profileCache.set(',
                  'if (user) {\n              profileCache.set('
              )

              path.write_text(s, encoding='utf-8')

          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-founder-number.yml
          git add classic-twitter-ja.user.js classic-twitter-ja-safari.user.js classic-twitter-en.user.js
          git commit -m "Fix Founder Number profile parsing in all userscripts"
          git push
