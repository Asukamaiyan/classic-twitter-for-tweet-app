name: Fix authenticated Founder Number lookup

on:
  push:
    paths:
      - 'CHANGELOG.md'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch all userscripts
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          files = [
            (Path('classic-twitter-ja.user.js'), '6.2.7'),
            (Path('classic-twitter-ja-safari.user.js'), '6.3.0'),
            (Path('classic-twitter-en.user.js'), '6.2.5-en'),
          ]

          new_fetch = r'''  function fetchProfile(username) {
            const key = normUser(username);
            if (!key) return Promise.resolve(null);
            if (profileCache.has(key)) return Promise.resolve(profileCache.get(key));
            if (profilePending.has(key)) return profilePending.get(key);

            const promise = getAuth()
              .then(auth => {
                if (!auth?.token) return null;
                return requestJSON(
                  PROFILE_API + encodeURIComponent(username),
                  { Authorization: `Bearer ${auth.token}` }
                );
              })
              .then(json => {
                const user =
                  json?.user ??
                  json?.profile ??
                  json?.data?.user ??
                  json?.data?.profile ??
                  json?.data ??
                  json;

                if (user) profileCache.set(key, user);
                profilePending.delete(key);
                return user || null;
              })
              .catch(() => {
                profilePending.delete(key);
                return null;
              });

            profilePending.set(key, promise);
            return promise;
          }
'''

          for path, version in files:
            s = path.read_text(encoding='utf-8')
            s = re.sub(r'(?m)^// @version\s+\S+', f'// @version      {version}', s, count=1)
            start = s.find('  function fetchProfile(')
            if start < 0:
              raise RuntimeError(f'fetchProfile missing: {path}')
            end = s.find('  function userFromHref(', start)
            if end < 0:
              raise RuntimeError(f'userFromHref missing: {path}')
            s = s[:start] + new_fetch + '\n' + s[end:]
            path.write_text(s, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-founder-auth.yml
          git add classic-twitter-ja.user.js classic-twitter-ja-safari.user.js classic-twitter-en.user.js
          git commit -m "Fix Founder Number lookup with authenticated profile API"
          git push
