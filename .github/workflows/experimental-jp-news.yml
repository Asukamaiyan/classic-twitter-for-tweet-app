name: Experimental Japanese news override

on:
  push:
    paths:
      - '.github/workflows/experimental-jp-news.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Chrome Japanese userscript
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('classic-twitter-ja.user.js')
          s = path.read_text(encoding='utf-8')
          s = re.sub(r'(?m)^// @version\s+\S+', '// @version      6.3.0-test', s, count=1)

          if '// @grant        unsafeWindow' not in s:
              s = s.replace('// @grant        GM_xmlhttpRequest\n', '// @grant        GM_xmlhttpRequest\n// @grant        unsafeWindow\n', 1)
          if '// @connect      news.google.com' not in s:
              s = s.replace('// @connect      api.tweet.app\n', '// @connect      api.tweet.app\n// @connect      news.google.com\n', 1)

          marker = "  const LOGO = 'https://app.tweet.app/assets/brand/bird-blue.svg';"
          code = r'''

  // Experimental: replace tweet.app's global news feed with Google News Japan RSS.
  // Chrome/Tampermonkey test only. Falls back to tweet.app if RSS loading fails.
  function googleNewsRSS(topic) {
    const base = 'https://news.google.com/rss';
    const suffix = 'hl=ja&gl=JP&ceid=JP:ja';

    if (topic === 'sports') {
      return `${base}/search?q=${encodeURIComponent('スポーツ')}&${suffix}`;
    }

    if (topic === 'entertainment') {
      return `${base}/search?q=${encodeURIComponent('エンタメ OR 芸能')}&${suffix}`;
    }

    if (topic === 'technology') {
      return `${base}/search?q=${encodeURIComponent('テクノロジー OR IT')}&${suffix}`;
    }

    return `${base}?${suffix}`;
  }

  function gmText(url) {
    return new Promise((resolve, reject) => {
      if (typeof GM_xmlhttpRequest !== 'function') {
        reject(new Error('GM_xmlhttpRequest unavailable'));
        return;
      }

      GM_xmlhttpRequest({
        method: 'GET',
        url,
        headers: { Accept: 'application/rss+xml, application/xml, text/xml, */*' },
        timeout: 12000,
        onload: r => r.status >= 200 && r.status < 300
          ? resolve(r.responseText)
          : reject(new Error(`RSS HTTP ${r.status}`)),
        onerror: () => reject(new Error('RSS network error')),
        ontimeout: () => reject(new Error('RSS timeout'))
      });
    });
  }

  function textFromHTML(html) {
    const doc = new DOMParser().parseFromString(`<body>${html || ''}</body>`, 'text/html');
    return clean(doc.body?.textContent || '');
  }

  async function japaneseNewsPayload(topic, limit = 10) {
    const xml = await gmText(googleNewsRSS(topic));
    const doc = new DOMParser().parseFromString(xml, 'application/xml');

    if (doc.querySelector('parsererror')) {
      throw new Error('Invalid Google News RSS');
    }

    const articles = [...doc.querySelectorAll('item')]
      .slice(0, Math.max(1, Math.min(Number(limit) || 10, 20)))
      .map(item => {
        const rawTitle = clean(item.querySelector('title')?.textContent || '');
        const source = clean(item.querySelector('source')?.textContent || '');
        const link = clean(item.querySelector('link')?.textContent || '');
        const published = clean(item.querySelector('pubDate')?.textContent || '');
        const description = textFromHTML(item.querySelector('description')?.textContent || '');
        let title = rawTitle;

        if (source && title.endsWith(` - ${source}`)) {
          title = title.slice(0, -(` - ${source}`).length).trim();
        }

        return {
          id: `${link}::${title}`,
          title,
          description,
          url: link,
          image: '',
          source,
          publishedAt: published ? new Date(published).toISOString() : new Date().toISOString()
        };
      })
      .filter(article => article.title && article.url);

    return { success: true, topic, articles };
  }

  function installJapaneseNewsOverride() {
    const page = typeof unsafeWindow !== 'undefined' ? unsafeWindow : window;

    if (!page?.fetch || page.__ctJapaneseNewsOverrideInstalled) {
      return;
    }

    const originalFetch = page.fetch.bind(page);
    page.__ctJapaneseNewsOverrideInstalled = true;

    page.fetch = async function(input, init) {
      let url = '';

      try {
        url = typeof input === 'string' ? input : input?.url || String(input || '');
      } catch {}

      let parsed;

      try {
        parsed = new URL(url, location.href);
      } catch {
        return originalFetch(input, init);
      }

      if (
        parsed.hostname === 'api.tweet.app' &&
        parsed.pathname === '/api/news/headlines'
      ) {
        const topic = parsed.searchParams.get('topic') || 'nation';
        const limit = parsed.searchParams.get('limit') || '10';

        try {
          const payload = await japaneseNewsPayload(topic, limit);
          const ResponseCtor = page.Response || Response;

          return new ResponseCtor(JSON.stringify(payload), {
            status: 200,
            headers: { 'Content-Type': 'application/json; charset=utf-8' }
          });
        } catch (error) {
          console.debug('[Classic Twitter JP experimental news] fallback', error);
        }
      }

      return originalFetch(input, init);
    };
  }

  installJapaneseNewsOverride();
'''

          if 'function installJapaneseNewsOverride()' not in s:
              if marker not in s:
                  raise RuntimeError('LOGO marker missing')
              s = s.replace(marker, marker + code, 1)

          path.write_text(s, encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/experimental-jp-news.yml
          git add classic-twitter-ja.user.js
          git commit -m "Test Japanese Google News feed in Chrome userscript"
          git push
