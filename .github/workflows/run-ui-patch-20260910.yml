name: Run September 10 UI patch
on:
  push:
    paths:
      - '.github/workflows/run-ui-patch-20260910.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch files
        run: python3 .github/scripts/patch_ui_20260910.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/scripts/patch_ui_20260910.py .github/workflows/run-ui-patch-20260910.yml .github/workflows/patch-ui-japanese-notifications.yml
          git add classic-twitter-ja.user.js classic-twitter-ja-safari.user.js classic-twitter-en.user.js
          git commit -m "Polish Japanese UI and notification avatar links"
          git push
